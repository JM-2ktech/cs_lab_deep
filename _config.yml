title: "Copilot Studio Lab - Deep Dive"
description: >-
  Self AI Academy 3기 심화교육 3일 과정.
baseurl: "/cs_lab_deep"
url: "https://jm-2ktech.github.io"

theme: just-the-docs
plugins:
  - jekyll-feed

# 코드블록 복사 버튼 — 테마 기본값도 true지만, 이 교안은 복붙이 주 동작이라 명시해 둔다.
# 버튼 스타일(상시 노출·다크 배경 대응)은 _sass/custom/custom.scss에 있다.
enable_copy_code_button: true

search_enabled: true
search:
  heading_level: 2
  previews: 3

mermaid:
  version: "10.9.1"

aux_links:
  "Microsoft Learn Copilot Studio":
    - "https://learn.microsoft.com/ko-kr/microsoft-copilot-studio/"
  "GitHub":
    - "https://github.com/JM-2ktech/cs_lab_deep"

nav_sort: order
color_scheme: light

# ★ 필수 — 전 페이지 기본 레이아웃 (없으면 테마 미적용 = 맨 HTML 렌더링)
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Just the Docs callouts — 본문의 {: .note } / {: .warning } / {: .important } / {: .time } 렌더링 정의
callouts_level: quiet
callouts:
  note:
    title: 팁
    color: blue
  time:
    title: 시간
    color: green
  warning:
    title: 주의
    color: red
  important:
    title: 핵심
    color: yellow

# 빌드 제외
exclude:
  - _instructions/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
